services:
  - type: web
    name: meditalk
    env: node
    plan: free
    rootDir: meditalk
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meditalk-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard — DO NOT commit the actual key
      - key: FRONTEND_URL
        value: https://meditalk.onrender.com  # Update if your domain changes

databases:
  - name: meditalk-db
    plan: free
    databaseName: meditalk
